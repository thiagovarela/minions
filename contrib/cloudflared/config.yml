# cloudflared configuration for running Minions behind Cloudflare Tunnel.
#
# Install:  https://developers.cloudflare.com/cloudflare-one/connections/connect-networks/
# Location: /etc/cloudflared/config.yml   (after `cloudflared service install`)
#
# The tunnel is outbound-only — no open ports, no port forwarding, no public
# IP needed on the host. Cloudflare edge terminates TLS for all zones and
# forwards to the local minions proxy over this tunnel.

tunnel: <TUNNEL-UUID>
credentials-file: /etc/cloudflared/<TUNNEL-UUID>.json

ingress:
  # ── ACME HTTP-01 challenges for custom domains ────────────────────────────
  # The proxy provisions custom-domain certs via HTTP-01 on its HTTP listener.
  # Route just the challenge path to plain HTTP so provisioning keeps working
  # through the tunnel. Add one rule per custom domain.
  - hostname: filmvision.ai
    path: ^/.well-known/acme-challenge/.*
    service: http://localhost:80
  - hostname: thiagovarela.com.br
    path: ^/.well-known/acme-challenge/.*
    service: http://localhost:80

  # ── Everything else → minions HTTPS proxy (TLS end-to-end) ────────────────
  # noTLSVerify: the origin serves its own LE/self-signed certs selected by
  # SNI; cloudflared passes the original Host header, so the proxy's
  # Host-based routing (apex → dashboard, subdomain → VM, custom domain → VM)
  # works unchanged.
  - hostname: miniclankers.com
    service: https://localhost:443
    originRequest:
      noTLSVerify: true
  - hostname: "*.miniclankers.com"
    service: https://localhost:443
    originRequest:
      noTLSVerify: true
  - hostname: filmvision.ai
    service: https://localhost:443
    originRequest:
      noTLSVerify: true
  - hostname: thiagovarela.com.br
    service: https://localhost:443
    originRequest:
      noTLSVerify: true

  # Catch-all: refuse anything else.
  - service: http_status:404
